version: '3.8'

services:

  postgres:
    image: postgres:13
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inji_verify
    ports:
      - "5432:5432"

  verify-service:
    container_name: verify-service
    image: mosipdev/inji-verify-service:develop
    ports:
      - "8080:8080"
    environment:
      - active_profile_env=default
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 10

  apitest:
    image: mosipdev/apitest-inji-verify:latest
    depends_on:
      verify-service:
        condition: service_healthy
    environment:
      ENV_ENDPOINT: http://verify-service:8080
      ENV_TESTLEVEL: smokeAndRegression
